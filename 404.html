<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nie znaleziono strony — P&amp;M Apartments</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem 1.5rem; background: #FAF8F5; color: #2C2C2C; font-family: system-ui, sans-serif; line-height: 1.7; text-align: center; }
    .logo { display: flex; align-items: center; gap: .75rem; color: #1A1A1A; text-decoration: none; text-transform: uppercase; letter-spacing: .1em; }
    .logo img { width: 34px; height: 34px; border-radius: 9999px; object-fit: cover; object-position: top; border: 1px solid rgba(184,149,106,.5); }
    .code { margin: 0; color: #B8956A; font-size: .8rem; text-transform: uppercase; letter-spacing: .25em; }
    h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; letter-spacing: -.03em; max-width: 36rem; }
    p { margin: 0; max-width: 32rem; color: rgba(44,44,44,.75); }
    .btn { display: inline-block; padding: 1rem 2.5rem; border: 1px solid #B8956A; color: #1A1A1A; text-decoration: none; text-transform: uppercase; font-size: .875rem; letter-spacing: .15em; box-shadow: 0 10px 30px rgba(184,149,106,.12), 0 2px 6px rgba(26,26,26,.06); transition: transform .25s ease, opacity .25s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 2px solid #B8956A; outline-offset: 4px; }
    .btn:active { transform: translateY(0); opacity: .85; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <a href="/" class="logo"><img src="/favicon.webp" alt="P&amp;M Apartments logo" width="34" height="34"><span>P&amp;M Apartments</span></a>
  <p class="code">Błąd 404</p>
  <h1>Nie znaleźliśmy tej strony</h1>
  <p>Adres mógł się zmienić albo strona została usunięta.</p>
  <a href="/" class="btn">Wróć na stronę główną</a>
</body>
</html>
